<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f6">
  <title>Media Upload Portal</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #eef3f6;
      --card-bg: #f8f9fb;
      --panel-border: rgba(23, 28, 38, 0.08);
      --field-bg: #f7f8fa;
      --field-border: #dfe5ec;
      --text: #1d2430;
      --muted: #6f7d8d;
      --placeholder: #afb9c7;
      --purple: #4d4fc7;
      --purple-dark: #3d40b1;
      --drop-border: #d7dfe8;
      --drop-text: #4c5563;
      --shadow: 0 16px 40px rgba(32, 39, 55, 0.08);
      --input-radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      width: min(100%, 550px);
    }

    .panel {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 20px 20px 18px;
    }

    .upload-icon {
      width: 62px;
      height: 62px;
      margin: 6px auto 18px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(180deg, #eef1ff 0%, #e4e7fa 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .upload-icon svg {
      width: 34px;
      height: 34px;
      display: block;
      fill: none;
      stroke: #4d4fc7;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .upload-icon .cloud {
      fill: rgba(77, 79, 199, 0.1);
      stroke: #5d62d6;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(180, 118, 25, 0.12), rgba(155, 39, 47, 0.12));
      border: 1px solid rgba(155, 39, 47, 0.14);
      color: #7a3f19;
      font-size: 0.73rem;
      letter-spacing: 0.08em;
      font-weight: 500;
      text-transform: uppercase;
    }

    .top-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d18e1f, #aa3d32);
      box-shadow: 0 0 0 3px rgba(209, 142, 31, 0.12);
    }

    .title-wrap {
      position: relative;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 1.7vw + 1.1rem, 2.5rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 500;
      color: #1f2833;
    }

    .subtitle {
      margin: 10px 0 22px;
      text-align: center;
      color: #5f6c79;
      font-size: 0.93rem;
      font-weight: 500;
      font-style: italic;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .field-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2a3645;
    }

    .limit {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--purple);
    }

    .text-input {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: var(--input-radius);
      background: rgba(255, 255, 255, 0.32);
      padding: 14px 14px;
      font-size: 0.96rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .text-input::placeholder {
      color: var(--placeholder);
      font-weight: 500;
    }

    .text-input:focus {
      border-color: rgba(77, 79, 199, 0.4);
      box-shadow: 0 0 0 4px rgba(77, 79, 199, 0.08);
    }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 170px;
      width: 100%;
      padding: 18px 16px;
      border: 2px dashed var(--drop-border);
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      color: var(--drop-text);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .dropzone:hover,
    .dropzone.is-dragging {
      border-color: rgba(77, 79, 199, 0.45);
      background: rgba(77, 79, 199, 0.03);
      transform: translateY(-1px);
    }

    .drop-icon {
      width: 62px;
      height: 62px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      background: rgba(110, 115, 127, 0.08);
    }

    .drop-icon svg {
      width: 36px;
      height: 36px;
      stroke: rgba(64, 72, 90, 0.75);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drop-title {
      font-size: 1.02rem;
      font-weight: 500;
      color: #2e3b48;
    }

    .drop-subtitle {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #7a8596;
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      background: rgba(255,255,255,0.35);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #2e3b48;
    }

    .file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: var(--muted);
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .remove-file {
      border: 1px solid rgba(165, 61, 61, 0.18);
      background: rgba(179, 54, 54, 0.06);
      color: #9c2c2c;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .success-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(28, 72, 43, 0.96);
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      box-shadow: 0 14px 28px rgba(20, 40, 30, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
    }

    .success-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .submit-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #4f50d1 0%, #4748c8 100%);
      color: #fff;
      height: 54px;
      font-size: 0.96rem;
      font-weight: 500;
      box-shadow: 0 8px 18px rgba(79, 80, 209, 0.28);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(79, 80, 209, 0.28);
    }

    .submit-button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .status {
      min-height: 18px;
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }

    .status[data-state="error"] {
      color: #B03A3A;
    }

    .status[data-state="success"] {
      color: #1f7d55;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 14px;
      }

      .panel {
        padding: 22px 18px 18px;
        border-radius: 18px;
      }

      .upload-icon {
        width: 52px;
        height: 52px;
        margin-bottom: 14px;
      }

      .top-badge {
        font-size: 0.63rem;
        letter-spacing: 0.1em;
      }

      .title-wrap::before,
      .title-wrap::after {
        width: 24px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .subtitle {
        font-size: 0.82rem;
        margin-bottom: 18px;
      }

      .field-label {
        letter-spacing: 0.08em;
      }

      .dropzone {
        min-height: 172px;
      }

      .drop-title {
        font-size: 0.96rem;
      }

      .drop-subtitle {
        font-size: 0.85rem;
      }

      .submit-button {
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="panel">
      <div class="top-badge" aria-label="Celebration wedding upload"><span class="dot"></span> Wedding memories</div>

      <div class="upload-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img" aria-label="Wedding upload icon">
          <path class="cloud" d="M22 46h20a12 12 0 0 0 1.5-23.8A15 15 0 0 0 15 24a10 10 0 0 0 7 17Z"></path>
          <path d="M32 18v20"></path>
          <path d="M24 26l8-8 8 8"></path>
          <circle cx="32" cy="18" r="3.2" fill="#d28d25" stroke="none"></circle>
        </svg>
      </div>

      <div class="title-wrap">
        <h1>Wedding Memory Upload</h1>
      </div>
      <p class="subtitle">Share the joy, rituals, and candid moments from our celebration.</p>

      <form id="upload-form" class="form" method="post" target="drive-upload-frame">
        <div>
          <label class="field-label" for="sender-name">Your name</label>
          <input id="sender-name" class="text-input" name="senderName" type="text" maxlength="120" autocomplete="name" placeholder="Enter your full name" required>
        </div>

        <div>
          <div class="label-row">
            <label class="field-label" for="files">Select media</label>
            <span class="limit">Max 25 MB</span>
          </div>

          <label id="dropzone" class="dropzone" for="files">
            <span class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h10A2.5 2.5 0 0 1 19 7.5v8.9A2.6 2.6 0 0 1 16.4 19H6.6A2.6 2.6 0 0 1 4 16.4V7.5Z"></path>
                <path d="M8.5 14.5 11 12l1.9 1.9 3.2-3.3"></path>
                <circle cx="15.5" cy="9.2" r="1.2"></circle>
              </svg>
            </span>
            <span class="drop-title">Click or drag photos/videos here</span>
            <span class="drop-subtitle">Supports HD Videos, MP4, MOV, JPG, PNG</span>
            <input class="visually-hidden" id="files" name="files" type="file" accept="image/*,video/*" multiple aria-required="true">
          </label>
          <ul id="file-list" class="file-list" aria-live="polite"></ul>
        </div>

        <input id="payload" name="payload" type="hidden">
        <button id="submit-button" class="submit-button" type="submit">Upload File</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <div id="success-toast" class="success-toast" aria-live="polite">Upload successful</div>

  <iframe id="drive-upload-frame" name="drive-upload-frame" title="Upload response" class="visually-hidden"></iframe>

  <script>
    const UPLOAD_ENDPOINT = "https://script.google.com/macros/s/AKfycbwWEiaSwz2QtQ6aMdKXP0Kq6xwvXbu425xlN-enr1eZxpWJh7RdyYb82TPNQtJFUKbG/exec";
    const MAX_FILES = 10;
    const MAX_TOTAL_BYTES = 25 * 1024 * 1024;
    const RESPONSE_TIMEOUT_MS = 10 * 60 * 1000;

    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#files");
    const dropzone = document.querySelector("#dropzone");
    const fileList = document.querySelector("#file-list");
    const payloadInput = document.querySelector("#payload");
    const submitButton = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    let selectedFiles = [];
    let activeRequestId = "";
    let responseTimeout;

    function setStatus(message, state) {
      status.textContent = message;
      status.dataset.state = state || "";
    }

    function formatBytes(bytes) {
      return bytes < 1024 * 1024
        ? `${(bytes / 1024).toFixed(0)} KB`
        : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function renderFiles() {
      fileList.replaceChildren();
      selectedFiles.forEach((file, index) => {
        const row = document.createElement("li");
        row.className = "file-row";

        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = file.name;

        const size = document.createElement("span");
        size.className = "file-size";
        size.textContent = formatBytes(file.size);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-file";
        remove.textContent = "Remove";
        remove.setAttribute("aria-label", `Remove ${file.name}`);
        remove.addEventListener("click", () => {
          selectedFiles.splice(index, 1);
          renderFiles();
          if (selectedFiles.length === 0) {
            setStatus("");
          } else {
            const totalBytes = selectedFiles.reduce((total, current) => total + current.size, 0);
            setStatus(`${selectedFiles.length} file${selectedFiles.length === 1 ? "" : "s"} ready${totalBytes > MAX_TOTAL_BYTES ? " (too large)" : ""}.`);
          }
        });

        row.append(name, size, remove);
        fileList.append(row);
      });
    }

    function acceptFiles(files) {
      selectedFiles = Array.from(files || []);
      renderFiles();

      const totalBytes = selectedFiles.reduce((total, file) => total + file.size, 0);
      if (selectedFiles.length > MAX_FILES) {
        setStatus(`Choose no more than ${MAX_FILES} files.`, "error");
      } else if (totalBytes > MAX_TOTAL_BYTES) {
        setStatus("Your files are over the 25 MB total limit.", "error");
      } else {
        setStatus(selectedFiles.length ? `${selectedFiles.length} file${selectedFiles.length === 1 ? "" : "s"} ready.` : "");
      }
    }

    function readAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          data: String(reader.result).split(",")[1]
        });
        reader.onerror = () => reject(new Error("Could not read one of the selected files."));
        reader.readAsDataURL(file);
      });
    }

    fileInput.addEventListener("change", () => acceptFiles(fileInput.files));

    ["dragenter", "dragover"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.add("is-dragging");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.remove("is-dragging");
      });
    });

    dropzone.addEventListener("drop", (event) => acceptFiles(event.dataTransfer.files));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (!selectedFiles.length) {
        setStatus("Choose at least one file to send.", "error");
        fileInput.focus();
        return;
      }

      const totalBytes = selectedFiles.reduce((total, file) => total + file.size, 0);
      if (selectedFiles.length > MAX_FILES || totalBytes > MAX_TOTAL_BYTES) {
        setStatus("Choose up to 10 files within the 25 MB total limit.", "error");
        return;
      }

      if (!UPLOAD_ENDPOINT.startsWith("https://script.google.com/")) {
        setStatus("This upload page has not been connected to Google Drive yet.", "error");
        return;
      }

      submitButton.disabled = true;
      setStatus("Preparing your files...");
      activeRequestId = crypto.randomUUID();

      try {
        const files = await Promise.all(selectedFiles.map(readAsBase64));
        const request = {
          requestId: activeRequestId,
          senderName: document.querySelector("#sender-name").value.trim(),
          files
        };
        payloadInput.value = JSON.stringify(request);
        form.action = UPLOAD_ENDPOINT;
        setStatus("Sending to Drive...");
        form.submit();

        responseTimeout = window.setTimeout(() => {
          submitButton.disabled = false;
          activeRequestId = "";
          setStatus("No confirmation received. Check Drive before retrying to avoid a duplicate upload.", "error");
        }, RESPONSE_TIMEOUT_MS);
      } catch (error) {
        submitButton.disabled = false;
        setStatus(error.message || "Could not prepare these files. Please try again.", "error");
      }
    });

    function showSuccessToast() {
      const toast = document.getElementById("success-toast");
      if (!toast) return;
      toast.classList.add("visible");
      clearTimeout(showSuccessToast.timer);
      showSuccessToast.timer = setTimeout(() => {
        toast.classList.remove("visible");
      }, 2000);
    }

    window.addEventListener("message", (event) => {
      let hostname = "";
      try {
        hostname = new URL(event.origin).hostname;
      } catch {
        return;
      }

      const trustedOrigin = hostname === "script.google.com" || hostname.endsWith("script.googleusercontent.com");
      if (!trustedOrigin || !event.data || event.data.type !== "drive-upload-result") return;
      if (event.data.requestId !== activeRequestId) return;

      window.clearTimeout(responseTimeout);
      submitButton.disabled = false;
      setStatus(event.data.message, event.data.ok ? "success" : "error");

      if (event.data.ok) {
        showSuccessToast();
        form.reset();
        selectedFiles = [];
        renderFiles();
        setTimeout(() => {
          window.location.reload();
        }, 2000);
      }
    });
  </script>
</body>
</html>
